<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 706" width="1240" height="706" role="img" aria-label="Initial storyboard sketch for AI and student learning"><rect width="1240" height="706" fill="#F7FAFC"/><rect x="34" y="24" width="1172" height="92" rx="18" fill="#EAF1FB" stroke="none" stroke-width="1"/><text x="60" y="63" fill="#2769B1" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="start">SKETCH 3  /  TIME AND ACTIVE LEARNING</text><text x="60" y="102" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="32" text-anchor="start">Can students learn more in less time?</text><rect x="34" y="140" width="1172" height="310" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="65" y="186" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="26" text-anchor="start">Study time: Harvard physics experiment</text><text x="65" y="219" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="18" text-anchor="start">Median minutes spent in each condition</text><text x="65" y="266" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="20" text-anchor="start">In-class active learning</text><rect x="400" y="243" width="600" height="33" rx="5" fill="#2769B1" stroke="none" stroke-width="1"/><text x="1025" y="268" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="start">60 min</text><text x="65" y="350" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="20" text-anchor="start">Guided AI tutor</text><rect x="400" y="327" width="490" height="33" rx="5" fill="#23977C" stroke="none" stroke-width="1"/><text x="1025" y="352" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="start">49 min</text><text x="65" y="426" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="start">Pair this with measured learning gains, not just time saved.</text><rect x="34" y="476" width="568" height="163" rx="14" fill="#E8F4F2" stroke="none" stroke-width="1"/><text x="61" y="518" fill="#23977C" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Potential explanation</text><text x="61" y="556" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="21" text-anchor="start">AI can free time for more practice</text><text x="61" y="585" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="21" text-anchor="start">when the student stays actively engaged.</text><rect x="622" y="476" width="584" height="163" rx="14" fill="#FFF1DC" stroke="none" stroke-width="1"/><text x="650" y="518" fill="#9A6418" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Critical limitation</text><text x="650" y="556" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="21" text-anchor="start">Less time alone does NOT prove</text><text x="650" y="585" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="21" text-anchor="start">the student learned less or more.</text><text x="45" y="673" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">Data: Kestin et al. (2025). Compare time and learning within this trial; do not pool scores across studies.</text></svg>