<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 684" width="1240" height="684" role="img" aria-label="Initial storyboard sketch for AI and student learning"><rect width="1240" height="684" fill="#F7FAFC"/><rect x="34" y="24" width="1172" height="92" rx="18" fill="#EAF1FB" stroke="none" stroke-width="1"/><text x="60" y="62" fill="#2769B1" font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="start">SKETCH 4  /  ENDING AND STUDENT DECISION GUIDE</text><text x="60" y="101" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="32" text-anchor="start">What should I do with my next hour?</text><rect x="405" y="142" width="430" height="68" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="620" y="180" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="23" text-anchor="middle">Is AI permitted for this task?</text><line x1="620" y1="210" x2="620" y2="235" stroke="#CBD5E1" stroke-width="2"/><line x1="335" y1="235" x2="905" y2="235" stroke="#CBD5E1" stroke-width="2"/><line x1="335" y1="235" x2="335" y2="260" stroke="#CBD5E1" stroke-width="2"/><line x1="905" y1="235" x2="905" y2="260" stroke="#CBD5E1" stroke-width="2"/><rect x="75" y="260" width="520" height="99" rx="14" fill="#FCE8E7" stroke="none" stroke-width="1"/><text x="335" y="299" fill="#AE4D48" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="middle">NO / UNSURE</text><text x="335" y="332" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="18" text-anchor="middle">Follow course rules; ask the instructor.</text><rect x="645" y="260" width="520" height="99" rx="14" fill="#E8F4F2" stroke="none" stroke-width="1"/><text x="905" y="299" fill="#23977C" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="middle">YES</text><text x="905" y="332" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="18" text-anchor="middle">What is your learning goal?</text><line x1="905" y1="359" x2="905" y2="389" stroke="#CBD5E1" stroke-width="2"/><line x1="790" y1="389" x2="1100" y2="389" stroke="#CBD5E1" stroke-width="2"/><line x1="790" y1="389" x2="790" y2="413" stroke="#CBD5E1" stroke-width="2"/><line x1="1100" y1="389" x2="1100" y2="413" stroke="#CBD5E1" stroke-width="2"/><rect x="635" y="414" width="310" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="790" y="449" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="middle">Exam without AI</text><text x="790" y="481" fill="#2769B1" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">Test yourself without help</text><text x="790" y="508" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="middle">after explanations.</text><rect x="955" y="414" width="250" height="120" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="1080" y="448" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="20" text-anchor="middle">Assignment task</text><text x="1080" y="479" fill="#2769B1" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">Use help carefully;</text><text x="1080" y="507" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="middle">verify and practice.</text><rect x="34" y="555" width="1172" height="92" rx="14" fill="#FFF1DC" stroke="none" stroke-width="1"/><text x="60" y="594" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="23" text-anchor="start">Proposed takeaway:</text><text x="265" y="594" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="22" text-anchor="start">Optimize learning per hour, not just speed of finishing.</text><text x="60" y="624" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Recommendations will be graded by evidence strength; not all choices have been directly tested.</text></svg>