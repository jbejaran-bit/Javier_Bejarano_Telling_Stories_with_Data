<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 520" role="img" aria-label="Dot plot of independent exam scores: no AI 34.5%, regular AI 34.0%, guided AI tutor 34.7%. All within one percentage point."><rect width="940" height="520" fill="white"/><text x="44" y="54" font-family='Arial,Helvetica,sans-serif' font-size="29" fill="#1c2d40" font-weight='bold'>The exam results are almost identical</text><text x="44" y="86" font-family='Arial,Helvetica,sans-serif' font-size="17" fill="#566477" >Independent exam averages after practicing in different conditions</text><rect x="40" y="111" width="860" height="62" rx="8" fill="#edf5f4"/><text x="64" y="151" font-family='Arial,Helvetica,sans-serif' font-size="21" fill="#246d59" font-weight='bold'>All three groups scored within 0.7 percentage points.</text><line x1="330" y1="225" x2="890" y2="225" stroke="#e4eaf0" stroke-width="2"/><text x="44" y="232" font-family='Arial,Helvetica,sans-serif' font-size="19" fill="#263648" >No AI</text><circle cx="523.2" cy="225" r="12" fill="#607d8b" stroke="white" stroke-width="3"/><text x="545.2" y="232" font-family='Arial,Helvetica,sans-serif' font-size="20" fill="#263648" font-weight='bold'>34.5%</text><line x1="330" y1="305" x2="890" y2="305" stroke="#e4eaf0" stroke-width="2"/><text x="44" y="312" font-family='Arial,Helvetica,sans-serif' font-size="19" fill="#263648" >Regular AI</text><circle cx="520.4" cy="305" r="12" fill="#e28b34" stroke="white" stroke-width="3"/><text x="542.4" y="312" font-family='Arial,Helvetica,sans-serif' font-size="20" fill="#263648" font-weight='bold'>34.0%</text><line x1="330" y1="385" x2="890" y2="385" stroke="#e4eaf0" stroke-width="2"/><text x="44" y="392" font-family='Arial,Helvetica,sans-serif' font-size="19" fill="#263648" >Guided AI tutor</text><circle cx="524.3199999999999" cy="385" r="12" fill="#3a8f76" stroke="white" stroke-width="3"/><text x="546.3199999999999" y="392" font-family='Arial,Helvetica,sans-serif' font-size="20" fill="#263648" font-weight='bold'>34.7%</text><line x1="330" y1="198" x2="330" y2="403" stroke="#dae2e9" stroke-dasharray="3 5"/><text x="321" y="432" font-family='Arial,Helvetica,sans-serif' font-size="14" fill="#667487" >0</text><line x1="470" y1="198" x2="470" y2="403" stroke="#dae2e9" stroke-dasharray="3 5"/><text x="461" y="432" font-family='Arial,Helvetica,sans-serif' font-size="14" fill="#667487" >25</text><line x1="610" y1="198" x2="610" y2="403" stroke="#dae2e9" stroke-dasharray="3 5"/><text x="601" y="432" font-family='Arial,Helvetica,sans-serif' font-size="14" fill="#667487" >50</text><line x1="750" y1="198" x2="750" y2="403" stroke="#dae2e9" stroke-dasharray="3 5"/><text x="741" y="432" font-family='Arial,Helvetica,sans-serif' font-size="14" fill="#667487" >75</text><line x1="890" y1="198" x2="890" y2="403" stroke="#dae2e9" stroke-dasharray="3 5"/><text x="881" y="432" font-family='Arial,Helvetica,sans-serif' font-size="14" fill="#667487" >100</text><text x="530" y="459" font-family='Arial,Helvetica,sans-serif' font-size="16" fill="#39495c" >Independent exam score (%)</text><text x="44" y="490" font-family='Arial,Helvetica,sans-serif' font-size="13" fill="#647184" >Source: Bastani et al. (2025) open data • Student-level descriptive means, not treatment effects</text></svg>