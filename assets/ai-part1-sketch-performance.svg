<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Initial storyboard sketch for AI and student learning"><rect width="1240" height="700" fill="#F7FAFC"/><rect x="34" y="24" width="1172" height="92" rx="18" fill="#EAF1FB" stroke="none" stroke-width="1"/><text x="60" y="63" fill="#2769B1" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="start">SKETCH 2  /  THE SURPRISING RESULT</text><text x="60" y="102" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="30" text-anchor="start">Doing well WITH AI is not the same as learning.</text><rect x="34" y="137" width="576" height="441" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="64" y="178" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="start">During assisted practice</text><text x="64" y="206" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Students can get help from AI</text><line x1="116" y1="484" x2="562" y2="484" stroke="#172B4D" stroke-width="2"/><line x1="116" y1="260" x2="116" y2="484" stroke="#172B4D" stroke-width="2"/><rect x="152" y="389" width="85" height="95" rx="5" fill="#64748B" stroke="none" stroke-width="1"/><text x="194" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">No AI</text><rect x="288" y="329" width="85" height="155" rx="5" fill="#E49A37" stroke="none" stroke-width="1"/><text x="330" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">GPT Base</text><rect x="424" y="288" width="85" height="196" rx="5" fill="#2769B1" stroke="none" stroke-width="1"/><text x="466" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">GPT Tutor</text><text x="64" y="553" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="14" text-anchor="start">Bar heights illustrative only. Final chart: values from the study.</text><rect x="628" y="137" width="576" height="441" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><text x="658" y="178" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="start">Later, without AI</text><text x="658" y="206" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">Students must solve problems alone</text><line x1="710" y1="484" x2="1156" y2="484" stroke="#172B4D" stroke-width="2"/><line x1="710" y1="260" x2="710" y2="484" stroke="#172B4D" stroke-width="2"/><rect x="746" y="338" width="85" height="146" rx="5" fill="#64748B" stroke="none" stroke-width="1"/><text x="788" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">No AI</text><rect x="882" y="380" width="85" height="104" rx="5" fill="#E49A37" stroke="none" stroke-width="1"/><text x="924" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">GPT Base</text><rect x="1018" y="341" width="85" height="143" rx="5" fill="#2769B1" stroke="none" stroke-width="1"/><text x="1060" y="511" fill="#172B4D" font-family="Arial,sans-serif" font-weight="600" font-size="17" text-anchor="middle">GPT Tutor</text><text x="658" y="553" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="14" text-anchor="start">Bar heights illustrative only. Final chart: values from the study.</text><rect x="34" y="596" width="1172" height="77" rx="12" fill="#FFF1DC" stroke="none" stroke-width="1"/><text x="60" y="628" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="22" text-anchor="start">Narrative twist:</text><text x="235" y="628" fill="#172B4D" font-family="Arial,sans-serif" font-weight="400" font-size="20" text-anchor="start">Improved assignment performance may hide weaker independent skills.</text><text x="60" y="655" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="16" text-anchor="start">Source to analyze: Bastani et al. (2025), randomized high-school math experiment.</text></svg>