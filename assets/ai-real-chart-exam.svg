<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 510" role="img" aria-label="Independent exam: no AI 34.5%, regular AI 33.9%, guided AI tutor 34.7%"><rect width="940" height="510" fill="#ffffff"/><text x="42" y="55" font-family="Arial,sans-serif" font-size="29" font-weight="bold" fill="#1f2937">2. The exam tells a different story</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="16" fill="#56616f">Average score on the independent exam, taken without AI</text><path d="M200 127 V414 H872" stroke="#b5bdc5" stroke-width="2" fill="none"/><text x="44" y="155" font-family="Arial" font-size="19" fill="#28323e">No AI</text><rect x="201" y="130" width="293.1" height="40" rx="3" fill="#607d8b"/><text x="504.1" y="157" font-family="Arial" font-size="19" font-weight="bold" fill="#28323e">34.5%</text><text x="44" y="257" font-family="Arial" font-size="19" fill="#28323e">Regular AI</text><rect x="201" y="232" width="288.6" height="40" rx="3" fill="#e28b34"/><text x="499.6" y="259" font-family="Arial" font-size="19" font-weight="bold" fill="#28323e">34.0%</text><text x="44" y="359" font-family="Arial" font-size="19" fill="#28323e">Guided AI tutor</text><rect x="201" y="334" width="294.9" height="40" rx="3" fill="#3a8f76"/><text x="505.9" y="361" font-family="Arial" font-size="19" font-weight="bold" fill="#28323e">34.7%</text><text x="45" y="465" font-family="Arial,sans-serif" font-size="14" fill="#555">Source: Bastani et al. (2025) open mathematics experiment data</text><text x="45" y="486" font-family="Arial,sans-serif" font-size="13" fill="#666">Student-level descriptive averages (not regression-adjusted treatment effects); scores 0–100%</text></svg>