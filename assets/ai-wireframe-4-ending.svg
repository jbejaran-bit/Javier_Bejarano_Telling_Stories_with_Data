<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" role="img" aria-label="Low fidelity storyboard 4: compare and conclude"><rect width="900" height="540" fill="#fff"/><rect x="28" y="26" width="844" height="484" fill="none" stroke="#333" stroke-width="2"/><text x="51" y="57" font-family="Arial" font-size="17" fill="#222">Wireframe 4 — compare and conclude</text><path d="M50 72 H850" stroke="#555" stroke-width="1.5"/><text x="65" y="114" font-family="Arial" font-size="20" fill="#222">Headline: Does the kind of AI help matter?</text><rect x="67" y="140" width="500" height="236" fill="white" stroke="#666" stroke-width="2"/><text x="85" y="172" font-family="Arial" font-size="17" fill="#222">Tableau: three groups, two outcomes</text><rect x="86" y="191" width="461" height="36" fill="#d8e4ea" stroke="#666" stroke-width="2"/><rect x="86" y="231" width="461" height="36" fill="#fbe6d2" stroke="#666" stroke-width="2"/><rect x="86" y="271" width="461" height="36" fill="#dcf1e9" stroke="#666" stroke-width="2"/><text x="102" y="215" font-family="Arial" font-size="16" fill="#222">No AI   |   practice vs exam</text><text x="102" y="255" font-family="Arial" font-size="16" fill="#222">Regular AI  |   practice vs exam</text><text x="102" y="295" font-family="Arial" font-size="16" fill="#222">Guided tutor  |   practice vs exam</text><rect x="588" y="140" width="235" height="236" fill="white" stroke="#666" stroke-width="2"/><text x="609" y="173" font-family="Arial" font-size="17" fill="#222">Key findings</text><text x="609" y="205" font-family="Arial" font-size="16" fill="#222">- what improved?</text><text x="609" y="235" font-family="Arial" font-size="16" fill="#222">- what declined?</text><text x="609" y="265" font-family="Arial" font-size="16" fill="#222">- limitations</text><rect x="67" y="400" width="756" height="52" fill="white" stroke="#666" stroke-width="2"/><text x="84" y="433" font-family="Arial" font-size="18" fill="#222">Final takeaway: practice without AI if the exam requires it.</text><text x="50" y="483" font-family="Arial" font-size="15" fill="#444">Story ends with evidence-based guidance, not a universal rule.</text></svg>