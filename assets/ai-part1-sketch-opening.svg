<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 710" width="1240" height="710" role="img" aria-label="Initial storyboard sketch for AI and student learning"><rect width="1240" height="710" fill="#F7FAFC"/><rect x="34" y="24" width="1172" height="90" rx="18" fill="#EAF1FB" stroke="none" stroke-width="1"/><text x="62" y="71" fill="#2769B1" font-family="Arial,sans-serif" font-weight="700" font-size="21" text-anchor="start">SKETCH 1  /  OPENING SCENE</text><text x="62" y="100" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="31" text-anchor="start">One hour. Four possible ways to use it.</text><rect x="34" y="139" width="1172" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="53" y="158" width="51" height="51" rx="12" fill="#DDEDFB" stroke="none" stroke-width="1"/><text x="78" y="192" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="middle">A</text><text x="126" y="176" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Work without AI</text><rect x="126" y="193" width="1036" height="33" rx="5" fill="#2769B1" stroke="none" stroke-width="1"/><text x="526" y="215" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">60 min independent work</text><rect x="34" y="258" width="1172" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="53" y="277" width="51" height="51" rx="12" fill="#E5F6ED" stroke="none" stroke-width="1"/><text x="78" y="311" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="middle">B</text><text x="126" y="295" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Use AI, then practice</text><rect x="126" y="312" width="135.53333333333333" height="33" rx="5" fill="#E49A37" stroke="none" stroke-width="1"/><text x="195.26666666666665" y="334" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">8 min AI</text><rect x="264.5333333333333" y="312" width="897.4666666666667" height="33" rx="5" fill="#23977C" stroke="none" stroke-width="1"/><text x="664.5333333333333" y="334" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">52 min practice</text><rect x="34" y="377" width="1172" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="53" y="396" width="51" height="51" rx="12" fill="#FFF0D9" stroke="none" stroke-width="1"/><text x="78" y="430" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="middle">C</text><text x="126" y="414" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Try first, then get hints</text><rect x="126" y="431" width="429.9166666666667" height="33" rx="5" fill="#2769B1" stroke="none" stroke-width="1"/><text x="342.45833333333337" y="453" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">25 min</text><rect x="558.9166666666667" y="431" width="170.16666666666666" height="33" rx="5" fill="#E49A37" stroke="none" stroke-width="1"/><text x="645.5000000000001" y="453" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">10 min</text><rect x="732.0833333333334" y="431" width="429.9166666666667" height="33" rx="5" fill="#23977C" stroke="none" stroke-width="1"/><text x="948.5416666666667" y="453" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">25 min</text><rect x="34" y="496" width="1172" height="105" rx="14" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1"/><rect x="53" y="515" width="51" height="51" rx="12" fill="#EDF0F4" stroke="none" stroke-width="1"/><text x="78" y="549" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="25" text-anchor="middle">D</text><text x="126" y="533" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="24" text-anchor="start">Use AI and stop</text><rect x="126" y="550" width="135.53333333333333" height="33" rx="5" fill="#E49A37" stroke="none" stroke-width="1"/><text x="195.26666666666665" y="572" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">8 min</text><rect x="264.5333333333333" y="550" width="897.4666666666667" height="33" rx="5" fill="#94A3B8" stroke="none" stroke-width="1"/><text x="664.5333333333333" y="572" fill="#FFFFFF" font-family="Arial,sans-serif" font-weight="600" font-size="16" text-anchor="middle">52 min elsewhere</text><text x="50" y="637" fill="#172B4D" font-family="Arial,sans-serif" font-weight="700" font-size="27" text-anchor="start">Question to the audience: who learns most when the AI is taken away?</text><text x="50" y="674" fill="#64748B" font-family="Arial,sans-serif" font-weight="400" font-size="17" text-anchor="start">All schedules are hypothetical. They are opening-story options, not measured research results.</text></svg>